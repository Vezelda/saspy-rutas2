services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    container_name: osrm-paraguay
    restart: unless-stopped
    volumes:
      - ./data:/data
    command: osrm-routed --algorithm mld --max-table-size 20000 /data/paraguay-latest.osrm
    networks:
      - routing
    # No "ports:" a propósito — solo VROOM (dentro de la red interna) le habla a OSRM.

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.15.0
    container_name: vroom
    restart: unless-stopped
    depends_on:
      - osrm
    volumes:
      - ./conf:/conf
    environment:
      - VROOM_ROUTER=osrm
    networks:
      - routing
    # Tampoco expone puerto al host — solo el proxy lo alcanza por la red interna.

  proxy:
    image: nginx:alpine
    container_name: vroom-proxy
    restart: unless-stopped
    depends_on:
      - vroom
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/vroom.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - routing

networks:
  routing:
    driver: bridge
