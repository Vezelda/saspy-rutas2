server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # VROOM no tiene autenticación propia — la agrega este proxy.
    # Sin esto, cualquiera en internet podría usar el motor y consumir tu CPU.
    auth_basic           "Saspy Routing Engine";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 5m;

    location / {
        # El navegador manda un pedido OPTIONS "de prueba" (preflight) antes del
        # POST real — sin esto, ese preflight pega contra auth_basic, falla, y el
        # navegador aborta el pedido real antes de mandarlo.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        # vroom-express ya manda su propio Access-Control-Allow-Origin — lo ocultamos
        # para no duplicarlo con el nuestro (el navegador rechaza headers repetidos).
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        proxy_pass http://vroom:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Puente hacia la API de lockers de Saspy Express — esa API no tiene CORS
    # propio, así que el navegador no le puede pegar directo. Este proxy la
    # alcanza desde el servidor (sin restricción de CORS) y le agrega los
    # headers necesarios en la respuesta. Protegido por el mismo usuario/
    # contraseña que el resto de este servidor.
    location /lockers-sync/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        proxy_ssl_server_name on;
        proxy_pass https://api.saspyexpress.com/lockers/listlockers/;
        proxy_set_header Host api.saspyexpress.com;
    }

    # Backend de datos compartidos (paradas, choferes, sesión del día, etc.) —
    # así todos los que abren la app ven y editan lo mismo, no cada uno su copia.
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, PUT, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, PUT, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        proxy_pass http://dataserver:3001/;
        proxy_set_header Host $host;
    }
}
