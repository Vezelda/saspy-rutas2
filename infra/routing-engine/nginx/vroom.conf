server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # VROOM no tiene autenticación propia — la agrega este proxy.
    # Sin esto, cualquiera en internet podría usar el motor y consumir tu CPU.
    auth_basic           "Saspy Routing Engine";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 5m;

    location / {
        # El navegador manda un pedido OPTIONS "de prueba" (preflight) antes del
        # POST real — sin esto, ese preflight pega contra auth_basic, falla, y el
        # navegador aborta el pedido real antes de mandarlo.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        # vroom-express ya manda su propio Access-Control-Allow-Origin — lo ocultamos
        # para no duplicarlo con el nuestro (el navegador rechaza headers repetidos).
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        proxy_pass http://vroom:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
