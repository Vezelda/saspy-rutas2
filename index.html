<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saspy Express — Gestión de Rutas</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

<div class="layout">

  <!-- ── Sidebar ────────────────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="logo">
      <img class="logo-icon" src="assets/image/2023_saspy_iso.png" alt="Saspy Express">
      <div>
        <div class="logo-title">Saspy Express</div>
        <div class="logo-sub">Gestión de rutas</div>
      </div>
    </div>
    <nav class="nav">
      <a class="nav-item active" data-module="config" href="#">
        <span class="nav-icon">⚙️</span>
        <span>Configuración</span>
      </a>
      <a class="nav-item" data-module="daily" href="#">
        <span class="nav-icon">📋</span>
        <span>Armar ruta del día</span>
      </a>
    </nav>
  </aside>

  <!-- ── Contenido principal ────────────────────────────────────────── -->
  <main class="main" id="main">
    <!-- Inyectado por app.js -->
  </main>

</div>

<div id="toast-container" class="toast-container"></div>

<!-- Scripts: orden importa -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/geocode.js"></script>
<script src="js/lockersync.js"></script>
<script src="js/optimizer.js"></script>
<script src="js/printer.js"></script>
<script src="js/daily.js"></script>
<script src="js/app.js"></script>

</body>
</html>
